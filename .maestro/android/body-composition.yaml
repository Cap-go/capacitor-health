appId: app.capgo.health
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-health Demo'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: Run Android body composition E2E
    direction: DOWN
    timeout: 120000
- tapOn:
    text: Run Android body composition E2E
- tapOn:
    text: Allow all
    optional: true
- tapOn:
    text: Allow
    optional: true
- extendedWaitUntil:
    visible: 'E2E:body-composition:success'
    timeout: 300000