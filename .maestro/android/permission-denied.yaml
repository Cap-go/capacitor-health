appId: app.capgo.health
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: '@capgo/capacitor-health Demo'
    timeout: 60000
- scrollUntilVisible:
    element:
      text: Run Android permission denied E2E
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Run Android permission denied E2E
- extendedWaitUntil:
    visible: 'E2E:permission-denied:success'
    timeout: 30000