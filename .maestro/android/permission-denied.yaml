appId: app.capgo.health
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-health Demo'
    timeout: 60000
- scrollUntilVisible:
    element:
      text: Run Android permission denied E2E
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Run Android permission denied E2E
- scrollUntilVisible:
    element:
      id: e2eMarkerPane
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible: 'Android permission denied E2E passed'
    timeout: 15000