appId: app.capgo.health
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-health Demo'
    timeout: 60000
- extendedWaitUntil:
    visible: 'E2E:boot:ready'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Run Android permission denied E2E
    direction: DOWN
    timeout: 30000
- tapOn:
    id: e2e-android-permission-denied
- scrollUntilVisible:
    element:
      id: e2eMarkerPane
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible: 'E2E:permission-denied:success'
    timeout: 45000