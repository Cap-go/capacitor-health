appId: app.capgo.health
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-health Demo'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Run iOS unsupported types E2E
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Run iOS unsupported types E2E
- extendedWaitUntil:
    visible: 'E2E:ios-unsupported:success'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: Run iOS permission denied E2E
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Run iOS permission denied E2E
- extendedWaitUntil:
    visible: 'E2E:permission-denied:success'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: Run iOS kill relaunch prep
    direction: DOWN
    timeout: 120000
    speed: 80
- tapOn:
    text: Run iOS kill relaunch prep
- extendedWaitUntil:
    visible: 'E2E:kill-relaunch:prepped'
    timeout: 120000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: '@capgo/capacitor-health Demo'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Run iOS kill relaunch verify
    direction: DOWN
    timeout: 120000
    speed: 80
- tapOn:
    text: Run iOS kill relaunch verify
- extendedWaitUntil:
    visible: 'Kill relaunch E2E passed'
    timeout: 30000