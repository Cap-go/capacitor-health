appId: app.capgo.health
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-health Demo'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Run iOS unsupported types E2E
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Run iOS unsupported types E2E
- extendedWaitUntil:
    visible: 'E2E:ios-unsupported:success'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: Run iOS permission denied E2E
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Run iOS permission denied E2E
- extendedWaitUntil:
    visible: 'E2E:permission-denied:success'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: e2e-ios-kill-relaunch-prep
    direction: DOWN
    timeout: 30000
- tapOn:
    id: e2e-ios-kill-relaunch-prep
- extendedWaitUntil:
    visible: 'E2E:kill-relaunch:prepped'
    timeout: 120000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: '@capgo/capacitor-health Demo'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: e2e-ios-kill-relaunch-verify
    direction: DOWN
    timeout: 30000
- tapOn:
    id: e2e-ios-kill-relaunch-verify
- scrollUntilVisible:
    element:
      id: e2eMarkerPane
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible: 'E2E:kill-relaunch:success'
    timeout: 30000