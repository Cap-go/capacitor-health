appId: app.capgo.health
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-health Demo'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Run iOS unsupported types E2E
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Run iOS unsupported types E2E
- scrollUntilVisible:
    element:
      id: e2eMarkerPane
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible: 'E2E:ios-unsupported:success'
    timeout: 45000
- scrollUntilVisible:
    element:
      text: Run iOS permission denied E2E
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Run iOS permission denied E2E
- scrollUntilVisible:
    element:
      id: e2eMarkerPane
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible: 'E2E:permission-denied:success'
    timeout: 45000
- scrollUntilVisible:
    element:
      text: Run iOS kill relaunch prep
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Run iOS kill relaunch prep
- scrollUntilVisible:
    element:
      id: e2eMarkerPane
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible: 'E2E:kill-relaunch:prepped'
    timeout: 45000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: '@capgo/capacitor-health Demo'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Run iOS kill relaunch verify
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Run iOS kill relaunch verify
- scrollUntilVisible:
    element:
      id: e2eMarkerPane
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible: 'E2E:kill-relaunch:success'
    timeout: 45000