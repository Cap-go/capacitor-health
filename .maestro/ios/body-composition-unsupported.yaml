appId: app.capgo.health
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-health Demo'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: e2e-body-composition-ios-unsupported
    direction: DOWN
    timeout: 120000
- tapOn:
    id: e2e-body-composition-ios-unsupported
- extendedWaitUntil:
    visible: 'E2E:ios-unsupported:success'
    timeout: 120000