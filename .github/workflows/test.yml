name: Build source code and test it

on:
  push:
    branches:
      - renovate/**
  pull_request:
    branches: [ main ]
  workflow_call:  # Allow this workflow to be called by other workflows

env:
  MAESTRO_VERSION: cli-2.4.0

jobs:
  guard_swiftpm_version:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Enforce capacitor-swift-pm version
        run: |
          set -euo pipefail
          if ! grep -Eq 'https://github.com/ionic-team/capacitor-swift-pm\.git"[[:space:]]*,[[:space:]]*from:[[:space:]]*"8\.0\.0"' Package.swift; then
            echo "Expected capacitor-swift-pm to be pinned to 8.0.0 in Package.swift"
            exit 1
          fi
  build_android:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Build
        id: build_code
        run: bun run verify:android
      - name: Verify packed package in example app (Android)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh android
  build_ios:
    runs-on: macOS-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Build
        id: build_code
        run: bun run verify:ios
      - name: Verify packed package in example app (iOS)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh ios
  ios_unit_tests:
    runs-on: macOS-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install dependencies
        run: bun i
      - name: Run HealthPlugin XCTests
        run: bun run test:ios:unit
  maestro_android_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install root dependencies
        run: bun i
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Build example Android APK
        run: bash ./scripts/ci/build-example-android-apk.sh
      - name: Upload Maestro Android APK
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-apk
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  maestro_android_e2e:
    needs: maestro_android_apk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install root dependencies
        run: bun i
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download Maestro Android APK
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-apk
          path: example-app/android/app/build/outputs/apk/debug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Clear Android SDK temp cache
        shell: bash
        run: bash ./.github/scripts/ensure-android-emulator-sdk.sh
      - name: Run Android Maestro CI suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            PATH="$HOME/.maestro/bin:$PATH"
            CAPGO_MAESTRO_SKIP_BUILD=1
            MAESTRO_DRIVER_STARTUP_TIMEOUT=120000
            bun run test:maestro:android:ci
  maestro_ios_app:
    runs-on: macOS-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install root dependencies
        run: bun i
      - name: Select iOS simulator
        run: |
          simulator_id="$(./scripts/select-ios-simulator.sh)"
          echo "CAPGO_MAESTRO_IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Build example iOS app
        run: bash ./scripts/ci/build-example-ios-app.sh
      - name: Archive Maestro iOS app bundle
        run: tar -czf maestro-ios-app.tar.gz -C maestro-ios-derived-data/Build/Products/Debug-iphonesimulator App.app
      - name: Upload Maestro iOS app
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-app
          path: maestro-ios-app.tar.gz
          if-no-files-found: error
  maestro_ios_e2e:
    needs: maestro_ios_app
    runs-on: macOS-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install root dependencies
        run: bun i
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Select iOS simulator
        run: |
          simulator_id="$(./scripts/select-ios-simulator.sh)"
          echo "CAPGO_MAESTRO_IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Download Maestro iOS app
        uses: actions/download-artifact@v8
        with:
          name: maestro-ios-app
          path: .
      - name: Extract Maestro iOS app bundle
        run: tar -xzf maestro-ios-app.tar.gz
      - name: Resolve Maestro iOS app path
        id: maestro_ios_app
        run: |
          app_path="${GITHUB_WORKSPACE}/App.app"
          if [[ ! -d "$app_path" ]]; then
            echo "Missing App.app at $app_path" >&2
            exit 1
          fi
          echo "path=$app_path" >> "$GITHUB_OUTPUT"
      - name: Run iOS Maestro CI suite
        env:
          CAPGO_MAESTRO_SKIP_BUILD: '1'
          CAPGO_MAESTRO_IOS_APP_PATH: ${{ steps.maestro_ios_app.outputs.path }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
        run: bun run test:maestro:ios:ci
  web:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    name: 'Build code and test'
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Lint
        id: lint_code
        run: bun run lint
      - name: Verify packed package in example app (Web)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh web
      - name: Verify
        id: verify_code
        run: bun run verify:web
